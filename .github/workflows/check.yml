name: Check and export presentation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Build and static checks
        run: |
          python build.py
          python -m unittest discover -s tests -v
          node --check src/deck.js
          git diff --exit-code -- dist/index.html
      - name: Browser regression checks
        run: python tests/browser_checks.py
      - name: Capture all slides
        if: always()
        run: python shots.py
      - name: Export searchable PDF
        if: always()
        run: python make_pdf.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: star-guard-presentation
          path: |
            dist/index.html
            dist/star-guard-deck.pdf
            build/shots/
          if-no-files-found: error
